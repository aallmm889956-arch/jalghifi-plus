<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <title>جلغيفي بلس | متجر المنتجات الرقمية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#09090d;--panel:#15141b;--purple:#a855f7;--line:#382b46;--muted:#aaa3b4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
    header{background:#111116;border-bottom:1px solid #292333;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .logo{color:#c084fc;font-size:25px;font-weight:bold}
    button{border:0;border-radius:9px;padding:12px 17px;background:#923cff;color:#fff;cursor:pointer;font-size:15px}
    button:hover{filter:brightness(1.12)}
    .secondary{background:#30283b}.danger{background:#a83248}
    main{width:90%;max-width:1100px;margin:30px auto}
    .hero{background:linear-gradient(135deg,#29143c,#111116);border:1px solid #49305e;border-radius:18px;padding:45px 24px;text-align:center;margin-bottom:28px}
    .hero h1{color:#d8b4fe;font-size:clamp(26px,5vw,38px);margin-bottom:14px}
    .hero p{color:#d0c6d8;line-height:1.9}
    h2{color:#c084fc;margin:24px 0 16px}h3{margin-bottom:12px}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .product,.panel,.auth-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px}
    .product p{color:var(--muted);line-height:1.8;margin:10px 0;white-space:pre-wrap}
    .price{color:#d8b4fe;font-weight:bold;font-size:19px;margin:14px 0}
    .auth-box,.panel{margin-top:24px}
    input,textarea{display:block;width:100%;background:#09090d;color:#fff;border:1px solid #40354b;border-radius:8px;padding:13px;margin:11px 0;font-size:15px;font-family:Arial,sans-serif}
    textarea{min-height:85px;resize:vertical}
    .hidden{display:none!important}.message{color:#d8b4fe;margin-top:12px;line-height:1.8;overflow-wrap:anywhere}
    .muted{color:var(--muted);line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .manage-item{border-top:1px solid #382d43;padding:14px 0}
    footer{text-align:center;color:#777;padding:30px 12px;margin-top:45px;border-top:1px solid #292333}
  </style>
</head>
<body>
<header>
  <div class="logo">جلغيفي بلس</div>
  <div class="actions" style="margin:0">
    <button id="loginBtn">تسجيل الدخول</button>
    <button id="logoutBtn" class="secondary hidden">تسجيل الخروج</button>
  </div>
</header>
<main>
  <section class="hero">
    <h1>مرحباً بك في جلغيفي بلس</h1>
    <p>متجرك للمنتجات الرقمية — تصفّح المنتجات واختر ما يناسبك.</p>
  </section>

  <section id="authBox" class="auth-box hidden">
    <h2 id="authTitle">تسجيل الدخول</h2>
    <p class="muted" id="authHelp">سجّل الدخول إلى حسابك.</p>
    <input id="fullName" class="hidden" type="text" autocomplete="name" placeholder="الاسم الكامل">
    <input id="email" type="email" autocomplete="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
    <div class="actions">
      <button id="submitAuth">دخول</button>
      <button id="switchAuth" class="secondary">إنشاء حساب جديد</button>
    </div>
    <p id="authMessage" class="message" role="status"></p>
  </section>

  <section>
    <h2>منتجات المتجر</h2>
    <div id="products" class="products"><p class="muted">جاري تحميل المنتجات...</p></div>
    <p id="storeMessage" class="message" role="status"></p>
  </section>

  <section id="staffPanel" class="panel hidden">
    <h2>لوحة إدارة المنتجات</h2>
    <p id="welcome" class="muted"></p>
    <h3 style="margin-top:22px">إضافة منتج</h3>
    <input id="productName" type="text" placeholder="اسم المنتج">
    <textarea id="productDescription" placeholder="وصف المنتج"></textarea>
    <input id="productPrice" type="number" min="0" step="0.01" placeholder="السعر بالريال">
    <button id="addProduct">إضافة المنتج</button>
    <p id="adminMessage" class="message" role="status"></p>
    <h3 style="margin-top:26px">المنتجات الحالية</h3>
    <div id="manageProducts"></div>
  </section>
</main>
<footer>© <span id="year"></span> جلغيفي بلس — جميع الحقوق محفوظة</footer>

<script>
(() => {
  "use strict";
  const SUPABASE_URL = "https://cfdrwjvjjclaqnbvmvuf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_-8VbAf8C92ialpPZ02UJPQ__hrxOybz";
  const $ = id => document.getElementById(id);
  const staffRoles = ["admin","manager","employee"];
  let isSignup = false, currentUser = null, currentRole = null, productsCache = [];
  $("year").textContent = new Date().getFullYear();

  if (!window.supabase) {
    $("products").innerHTML = '<p class="muted">تعذر تحميل مكتبة المتجر. تأكد من اتصال الإنترنت ثم حدّث الصفحة.</p>';
    return;
  }
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  $("loginBtn").addEventListener("click", () => $("authBox").classList.toggle("hidden"));
  $("switchAuth").addEventListener("click", () => {
    isSignup = !isSignup;
    $("authTitle").textContent = isSignup ? "إنشاء حساب جديد" : "تسجيل الدخول";
    $("authHelp").textContent = isSignup ? "أنشئ حساب عميل. لا يمكن اختيار صلاحية مدير أو موظف من صفحة التسجيل." : "سجّل الدخول إلى حسابك.";
    $("submitAuth").textContent = isSignup ? "إنشاء الحساب" : "دخول";
    $("switchAuth").textContent = isSignup ? "لديك حساب؟ تسجيل الدخول" : "إنشاء حساب جديد";
    $("fullName").classList.toggle("hidden", !isSignup);
    $("authMessage").textContent = "";
  });

  $("submitAuth").addEventListener("click", async () => {
    const email = $("email").value.trim(), password = $("password").value, fullName = $("fullName").value.trim();
    $("authMessage").textContent = "يرجى الانتظار...";
    if (!email || !password) return $("authMessage").textContent = "أدخل البريد الإلكتروني وكلمة المرور.";
    if (password.length < 6) return $("authMessage").textContent = "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";
    try {
      if (isSignup) {
        if (!fullName) return $("authMessage").textContent = "أدخل الاسم الكامل.";
        const {data,error} = await db.auth.signUp({email,password,options:{data:{full_name:fullName}}});
        if (error) throw error;
        $("authMessage").textContent = data.session
          ? "تم إنشاء الحساب. إذا لم يظهر حسابك، يلزم إعداد سجل العميل في profiles."
          : "تم إرسال طلب إنشاء الحساب. تحقق من بريدك إذا كان تأكيد البريد مفعّلاً. يلزم إعداد دور العميل تلقائياً في قاعدة البيانات.";
        if (data.session) { $("authBox").classList.add("hidden"); await refreshPage(); }
      } else {
        const {error} = await db.auth.signInWithPassword({email,password});
        if (error) throw error;
        $("authBox").classList.add("hidden");
        await refreshPage();
      }
    } catch(e) { $("authMessage").textContent = "تعذر إكمال العملية: " + (e.message || "خطأ غير معروف"); }
  });

  $("logoutBtn").addEventListener("click", async () => {
    const {error} = await db.auth.signOut();
    if (error) { $("storeMessage").textContent = error.message; return; }
    currentUser = null; currentRole = null; await refreshPage();
  });

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
  }

  async function checkUser() {
    const {data,error} = await db.auth.getUser();
    if (error) throw error;
    currentUser = data.user || null; currentRole = null;
    $("loginBtn").classList.toggle("hidden",!!currentUser);
    $("logoutBtn").classList.toggle("hidden",!currentUser);
    $("staffPanel").classList.add("hidden");
    if (!currentUser) return;

    const {data:profile,error:profileError} = await db.from("profiles").select("full_name, role").eq("id",currentUser.id).maybeSingle();
    if (profileError) { $("welcome").textContent = "تعذر قراءة صلاحية الحساب: " + profileError.message; return; }
    if (!profile) { $("welcome").textContent = "الحساب مسجل، لكن لا يوجد سجل له في profiles. يلزم إعداد ملف العميل في قاعدة البيانات."; return; }
    currentRole = profile.role;
    if (staffRoles.includes(currentRole)) {
      $("staffPanel").classList.remove("hidden");
      $("welcome").textContent = "مرحباً " + (profile.full_name || currentUser.email) + " — الصلاحية: " + currentRole;
    }
  }

  async function loadProducts() {
    $("products").innerHTML = '<p class="muted">جاري تحميل المنتجات...</p>';
    $("storeMessage").textContent = "";
    const {data,error} = await db.from("products").select("*").eq("is_active",true).order("created_at",{ascending:false});
    if (error) {
      $("products").innerHTML = '<p class="muted">تعذر تحميل المنتجات. تحقق من جدول products وسياسات القراءة في Supabase.</p>';
      $("storeMessage").textContent = error.message;
      return;
    }
    productsCache = data || [];
    $("products").innerHTML = productsCache.length ? productsCache.map(p => `
      <article class="product">
        <h3>${escapeHTML(p.name)}</h3>
        <p>${escapeHTML(p.description || "لا يوجد وصف للمنتج.")}</p>
        <div class="price">${Number(p.price || 0).toFixed(2)} ريال</div>
        <button type="button" onclick="alert('ميزة الشراء والدفع الإلكتروني ستُضاف في مرحلة لاحقة.')">شراء المنتج</button>
      </article>`).join("") : '<p class="muted">لا توجد منتجات منشورة حالياً.</p>';
    renderManageProducts();
  }

  function renderManageProducts() {
    if (!staffRoles.includes(currentRole)) { $("manageProducts").innerHTML = ""; return; }
    $("manageProducts").innerHTML = productsCache.map(p => `
      <div class="manage-item">
        <strong>${escapeHTML(p.name)}</strong>
        <div class="actions">
          <button type="button" onclick="editProduct('${encodeURIComponent(String(p.id))}')">تعديل</button>
          <button type="button" class="danger" onclick="deleteProduct('${encodeURIComponent(String(p.id))}')">حذف</button>
        </div>
      </div>`).join("") || '<p class="muted">لا توجد منتجات لإدارتها.</p>';
  }

  $("addProduct").addEventListener("click", async () => {
    if (!staffRoles.includes(currentRole)) return;
    const name = $("productName").value.trim(), description = $("productDescription").value.trim();
    const priceText = $("productPrice").value, price = Number(priceText);
    if (!name || priceText === "" || !Number.isFinite(price) || price < 0) return $("adminMessage").textContent = "أدخل اسم المنتج وسعراً صحيحاً.";
    $("adminMessage").textContent = "جاري إضافة المنتج...";
    const {error} = await db.from("products").insert({name,description,price,is_active:true});
    if (error) { $("adminMessage").textContent = "تعذر إضافة المنتج: " + error.message; return; }
    $("productName").value = ""; $("productDescription").value = ""; $("productPrice").value = "";
    $("adminMessage").textContent = "تمت إضافة المنتج.";
    await loadProducts();
  });

  window.editProduct = async encodedId => {
    if (!staffRoles.includes(currentRole)) return;
    const id = decodeURIComponent(encodedId), p = productsCache.find(x => String(x.id) === id);
    if (!p) return;
    const name = prompt("اسم المنتج:",p.name); if (name === null) return;
    const description = prompt("وصف المنتج:",p.description || ""); if (description === null) return;
    const priceText = prompt("السعر بالريال:",p.price); if (priceText === null) return;
    const price = Number(priceText);
    if (!name.trim() || priceText.trim() === "" || !Number.isFinite(price) || price < 0) return alert("البيانات غير صحيحة.");
    const {error} = await db.from("products").update({name:name.trim(),description,price}).eq("id",id);
    if (error) alert("تعذر تعديل المنتج: " + error.message); else await loadProducts();
  };

  window.deleteProduct = async encodedId => {
    if (!staffRoles.includes(currentRole)) return;
    const id = decodeURIComponent(encodedId);
    if (!confirm("هل تريد حذف هذا المنتج؟")) return;
    const {error} = await db.from("products").delete().eq("id",id);
    if (error) alert("تعذر حذف المنتج: " + error.message); else await loadProducts();
  };

  async function refreshPage() {
    try { await checkUser(); await loadProducts(); }
    catch(e) { $("storeMessage").textContent = "حدث خطأ أثناء تشغيل المتجر: " + (e.message || "خطأ غير معروف"); }
  }
  db.auth.onAuthStateChange(() => setTimeout(refreshPage,0));
  refreshPage();
})();
</script>
</body>
</html>
