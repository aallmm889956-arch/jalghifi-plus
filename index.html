<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090f">
<title>جلغيفي بلس | متجر المنتجات الرقمية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08080e;--panel:#12121d;--panel2:#191827;--line:#302d43;--purple:#a855f7;--purple2:#7c3aed;--text:#f7f4ff;--muted:#aaa5bd;--green:#22a06b;--red:#d94b68;--gold:#e7bd69}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#241438 0,transparent 48%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;padding:10px 15px;cursor:pointer;font-weight:700;transition:.2s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.secondary{background:#29263a;border:1px solid #403b58}.success{background:#176b4c}.danger{background:#8f2943}.gold{background:#75551b}
.wrap{width:min(1180px,calc(100% - 30px));margin:auto}
.top{position:sticky;top:0;z-index:5;background:#09090feF;backdrop-filter:blur(16px);border-bottom:1px solid #30283d;padding:13px 0}
.topinner,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand b{color:#c084fc}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.hero{margin:24px 0;padding:clamp(25px,6vw,60px);border:1px solid #49305f;border-radius:25px;background:linear-gradient(115deg,#28143c 0%,#171525 58%,#10101a 100%);box-shadow:0 20px 60px #0005;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:#a855f71c;filter:blur(10px);left:-65px;top:-70px}
.hero h1{font-size:clamp(27px,5vw,43px);line-height:1.35;margin:0 0 10px;position:relative;z-index:1}.hero p{color:#d2c9df;max-width:600px;position:relative;z-index:1}.hero button{position:relative;z-index:1}
.muted{color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:16px}
.card,.box{background:linear-gradient(145deg,#171624,#11111a);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 28px #0002}
.product{display:flex;flex-direction:column;min-width:0}.product img{width:100%;height:175px;object-fit:cover;border-radius:13px;background:#0b0b12}.product h3{margin:12px 0 4px}.product .desc{color:var(--muted);min-height:48px;white-space:pre-wrap}.price{font-size:20px;font-weight:900;color:#dfc1ff}.product .bottom{margin-top:auto}
.pill{display:inline-block;border:1px solid #51436a;background:#241b32;color:#e8d5ff;padding:3px 9px;border-radius:99px;font-size:12px}
.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-size:14px;color:#e4dff0}
.field input,.field textarea,.field select,.searchbox{width:100%;padding:11px 12px;border:1px solid #403b55;background:#0b0b13;color:#fff;border-radius:11px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus,.searchbox:focus{border-color:var(--purple);box-shadow:0 0 0 3px #a855f722}
.field textarea{min-height:85px;resize:vertical}.field input[type=checkbox]{width:auto;accent-color:var(--purple)}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:14px;z-index:20}
.modal>div{background:#151421;border:1px solid #48405d;padding:20px;border-radius:19px;width:min(850px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 80px #0009}
.hidden{display:none!important}.notice{padding:12px 14px;background:#29213a;border:1px solid #49345e;border-radius:12px;margin:12px 0}.notice.ok{background:#102b22;border-color:#205c45}.notice.bad{background:#351722;border-color:#733047}
.empty{text-align:center;padding:35px 12px;color:var(--muted);grid-column:1/-1}
table{width:100%;border-collapse:collapse;min-width:760px}td,th{text-align:right;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#d7c4ef;background:#1b1928;position:sticky;top:0}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px}.small{font-size:12px;line-height:1.8}.actions{display:flex;gap:6px;flex-wrap:wrap}.summary{background:#0d0d16;border:1px solid var(--line);padding:13px;border-radius:13px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px;margin:15px 0}.stat{background:linear-gradient(145deg,#241832,#151421);border:1px solid #46345b;border-radius:15px;padding:15px}.stat strong{font-size:23px;display:block;color:#e2c4ff}.stat span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button.active{outline:2px solid #d8b4fe;background:#5b21b6}
.adminsection{margin-top:20px}.adminsection h3{margin:10px 0}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline>*{flex:1}.rating{color:var(--gold)}.footer{padding:38px 0;text-align:center;color:var(--muted)}
@media(max-width:650px){.wrap{width:min(100% - 20px,1180px)}.topinner{align-items:flex-start}.nav{width:100%}.nav button{flex:1;padding:9px 8px;font-size:12px}.hero{border-radius:18px}.product img{height:155px}.modal>div{padding:15px}}
</style>
</head>
<body>
<header class="top"><div class="wrap topinner">
<div class="brand">جلغيفي <b>بلس</b></div>
<nav class="nav">
<button class="secondary" onclick="scrollProducts()">المنتجات</button>
<button class="secondary" onclick="cartView()">السلة (<span id="count">0</span>)</button>
<button id="loginBtn" onclick="authView()">تسجيل الدخول</button>
<button id="ordersBtn" class="secondary hidden" onclick="ordersView()">طلباتي</button>
<button id="staffBtn" class="secondary hidden" onclick="staffView()">لوحة الإدارة</button>
<button id="logoutBtn" class="secondary hidden" onclick="logout()">خروج</button>
</nav></div></header>
<main class="wrap">
<section class="hero"><span class="pill">متجر المنتجات الرقمية</span><h1>اختياراتك الرقمية،<br>بتجربة تسوّق أفخم.</h1><p>تصفح المنتجات، أضف للسلة، وتابع طلبك من حسابك. يتم إرسال المنتج إليك يدويًا عبر البريد الإلكتروني بعد اعتماد الدفع.</p><button onclick="scrollProducts()">اكتشف المنتجات</button></section>
<div id="message" class="notice hidden" role="status"></div>
<section id="products">
<div class="sectionhead"><div><h2 style="margin:0">منتجاتنا</h2><div class="muted small">اختر المنتج المناسب لك</div></div>
<div class="inline" style="min-width:min(100%,420px)"><input class="searchbox" id="search" placeholder="ابحث عن منتج..." oninput="render()"><select class="searchbox" id="categoryFilter" onchange="render()" style="max-width:170px"><option value="">كل التصنيفات</option></select></div></div>
<div id="grid" class="grid"><div class="empty">جاري تحميل المنتجات…</div></div>
</section>
</main>
<footer class="footer">© <span id="year"></span> جلغيفي بلس — جميع الحقوق محفوظة</footer>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div><div class="row"><h2 id="title">نافذة</h2><button class="secondary" onclick="closeModal()">إغلاق</button></div><div id="body"></div></div></div>
<script>
const SUPABASE_URL="https://cfdrwjvjjclaqnbvmvuf.supabase.co";
const KEY="sb_publishable_-8VbAf8C92ialpPZ02UJPQ__hrxOybz";
const db=window.supabase.createClient(SUPABASE_URL,KEY);
let user=null,profile=null,products=[],cart=[],settings={},appliedCoupon=null,couponQuote=null,adminCache={orders:[],products:[],coupons:[],profiles:[]},adminTab='overview',favorites=new Set(JSON.parse(localStorage.getItem('jalghifi_favorites')||'[]'));
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t,type=''){const m=$('message');m.textContent=t;m.className='notice'+(type?' '+type:'');m.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
function modal(t,h){$('title').textContent=t;$('body').innerHTML=h;$('modal').classList.remove('hidden');document.body.style.overflow='hidden';}
function closeModal(){$('modal').classList.add('hidden');document.body.style.overflow='';}
function cash(x){return Number(x||0).toFixed(2)+' ريال';}
function scrollProducts(){$('products').scrollIntoView({behavior:'smooth'});}
function isStaff(){return ['admin','employee'].includes(profile?.role);}
function isAdmin(){return profile?.role==='admin';}
function paymentLabel(o){const s=o.payment_status||o.status;return ({pending:'بانتظار الدفع',under_review:'الإيصال قيد المراجعة',paid:'تم قبول الدفع',rejected:'تم رفض الإيصال'})[s]||s||'غير محدد';}
function orderStatusLabel(o){return o.account_sent_at?'تم التسليم عبر البريد':o.payment_status==='paid'?'تم اعتماد الدفع — بانتظار التسليم':paymentLabel(o);}
function nav(){$('loginBtn').classList.toggle('hidden',!!user);$('logoutBtn').classList.toggle('hidden',!user);$('ordersBtn').classList.toggle('hidden',!user);$('staffBtn').classList.toggle('hidden',!isStaff());}
async function init(){
 $('year').textContent=new Date().getFullYear();
 db.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(user){setTimeout(async()=>{try{await getProfile();nav();if(event==='PASSWORD_RECOVERY')recoveryView();}catch(e){say(e.message,'bad');}},0);}else{profile=null;nav();}});
 const {data:{session},error}=await db.auth.getSession();if(error)throw error;user=session?.user||null;
 if(user)await getProfile();
 await getSettings();await getProducts();nav();
 if(location.hash.includes('type=recovery'))recoveryView();
}
async function getProfile(){if(!user){profile=null;return;}const r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)throw r.error;profile=r.data||null;}
async function getSettings(){const r=await db.from('store_settings').select('*');settings={};if(!r.error)(r.data||[]).forEach(x=>settings[x.key]=x.value);}
async function getProducts(){
 const r=await db.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false});
 if(r.error){$('grid').innerHTML='<div class="empty">تعذر تحميل المنتجات: '+esc(r.error.message)+'</div>';return;}
 products=r.data||[];const rr=await db.from('reviews').select('product_id,reviewer_name,rating,comment,created_at').order('created_at',{ascending:false});const reviews=rr.error?[]:(rr.data||[]);
 products=products.map(p=>({...p,reviews:reviews.filter(x=>x.product_id===p.id)}));
 const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];const sel=$('categoryFilter');const old=sel.value;sel.innerHTML='<option value="">كل التصنيفات</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');sel.value=cats.includes(old)?old:'';
 render();
}
function render(){
 const term=($('search')?.value||'').trim().toLowerCase(),cat=$('categoryFilter')?.value||'';
 const list=products.filter(p=>(!cat||p.category===cat)&&(!term||(p.name||'').toLowerCase().includes(term)||(p.description||'').toLowerCase().includes(term)));
 $('grid').innerHTML=list.length?list.map(p=>`
 <article class="card product"><img loading="lazy" src="${esc(p.image_url||'https://placehold.co/600x400/171525/ffffff?text=Digital+Product')}" onerror="this.src='https://placehold.co/600x400/171525/ffffff?text=Product'">
 <div class="row"><span class="pill">${esc(p.category||'منتج رقمي')}</span><button class="secondary" aria-label="المفضلة" onclick="toggleFavorite('${p.id}')">${favorites.has(p.id)?'♥':'♡'}</button></div>
 <h3>${esc(p.name)}</h3><p class="desc">${esc(p.description||'')}</p>
 <div class="bottom"><div class="row"><b class="price">${cash(p.price)}</b><span class="muted small">${p.is_unlimited?'متوفر':Number(p.stock)>0?'المخزون '+Number(p.stock):'نفد المخزون'}</span></div>
 <button style="width:100%;margin-top:12px" onclick="add('${p.id}')" ${(!p.is_unlimited&&Number(p.stock)<=0)?'disabled':''}>أضف للسلة</button>
 ${p.reviews?.length?`<div class="small muted" style="margin-top:8px">⭐ ${p.reviews.reduce((a,r)=>a+Number(r.rating||0),0)/p.reviews.length|0} — ${p.reviews.length} تقييم</div>`:''}
 </div></article>`).join(''):'<div class="empty">لا توجد منتجات مطابقة.</div>';
}
function toggleFavorite(id){favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('jalghifi_favorites',JSON.stringify([...favorites]));render();}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;if(!p.is_unlimited&&Number(p.stock)<=0)return say('نفد المخزون','bad');const item=cart.find(x=>x.id===id);if(item){if(!p.is_unlimited&&item.qty>=Number(p.stock))return say('الكمية المطلوبة تتجاوز المخزون','bad');item.qty++;}else cart.push({id,qty:1});$('count').textContent=cart.reduce((a,x)=>a+x.qty,0);say('تمت إضافة المنتج للسلة','ok');}
function cartSubtotal(){return cart.reduce((sum,x)=>{const p=products.find(z=>z.id===x.id);return sum+(p?Number(p.price)*x.qty:0);},0);}
function cartView(){if(!cart.length)return modal('السلة','<p class="empty">السلة فارغة</p>');let total=0;const h=cart.map(x=>{const p=products.find(z=>z.id===x.id);if(!p)return '';total+=Number(p.price)*x.qty;return `<div class="row card"><div><b>${esc(p.name)}</b><div class="muted small">${cash(p.price)} للوحدة</div></div><div class="actions"><button class="secondary" onclick="changeQty('${x.id}',-1)">−</button><b>${x.qty}</b><button class="secondary" onclick="changeQty('${x.id}',1)">+</button><button class="danger" onclick="removeCart('${x.id}')">حذف</button></div></div>`;}).join('');modal('سلة التسوق',h+`<hr><b class="price">الإجمالي: ${cash(total)}</b><p><button onclick="checkout()">إتمام الطلب</button></p>`);}
function changeQty(id,d){const x=cart.find(z=>z.id===id),p=products.find(z=>z.id===id);if(!x||!p)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(z=>z.id!==id);else if(!p.is_unlimited&&x.qty>Number(p.stock))x.qty=Number(p.stock);$('count').textContent=cart.reduce((a,z)=>a+z.qty,0);cartView();}
function removeCart(id){cart=cart.filter(x=>x.id!==id);$('count').textContent=cart.reduce((a,z)=>a+z.qty,0);cartView();}
function authView(){modal('تسجيل الدخول',`<div class="tabs"><button onclick="authForm('in')">دخول</button><button class="secondary" onclick="authForm('up')">حساب جديد</button><button class="secondary" onclick="authForm('reset')">نسيت كلمة المرور</button></div><div id="form"></div>`);authForm('in');}
function authForm(m){$('form').innerHTML=(m==='up'?`<div class="field"><label>الاسم</label><input id="name" autocomplete="name"></div><div class="field"><label>الجوال</label><input id="phone" autocomplete="tel"></div>`:'')+`<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email"></div>${m==='reset'?'':`<div class="field"><label>كلمة المرور</label><input id="pass" type="password" autocomplete="${m==='in'?'current-password':'new-password'}"></div>`}<button onclick="${m==='in'?'login()':m==='up'?'signup()':'reset()'}">${m==='in'?'دخول':m==='up'?'إنشاء حساب':'إرسال رابط الاستعادة'}</button>`;}
async function login(){const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error)return say(r.error.message,'bad');user=r.data.user;await getProfile();closeModal();nav();say('تم تسجيل الدخول','ok');}
async function signup(){const r=await db.auth.signUp({email:$('email').value.trim(),password:$('pass').value,options:{data:{full_name:$('name').value.trim(),phone:$('phone').value.trim()},emailRedirectTo:'https://aallmm889956-arch.github.io/jalghifi-plus/'}});if(r.error)return say(r.error.message,'bad');closeModal();say('تم إنشاء الحساب. افحص بريدك لتأكيده.','ok');}
async function reset(){const email=$('email').value.trim();if(!email)return say('اكتب بريدك الإلكتروني أولاً','bad');const r=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://aallmm889956-arch.github.io/jalghifi-plus/'});if(r.error)return say(r.error.message,'bad');closeModal();say('تم إرسال رابط الاستعادة إلى بريدك.','ok');}
function recoveryView(){modal('تعيين كلمة مرور جديدة',`<p class="muted">أدخل كلمة المرور الجديدة.</p><div class="field"><label>كلمة المرور الجديدة</label><input id="newPassword" type="password" minlength="6"></div><div class="field"><label>تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="6"></div><button onclick="saveNewPassword()">حفظ كلمة المرور</button>`);}
async function saveNewPassword(){const p=$('newPassword').value,c=$('confirmPassword').value;if(p.length<6)return say('كلمة المرور يجب أن تكون 6 أحرف على الأقل','bad');if(p!==c)return say('كلمتا المرور غير متطابقتين','bad');const r=await db.auth.updateUser({password:p});if(r.error)return say(r.error.message,'bad');closeModal();say('تم تغيير كلمة المرور بنجاح','ok');await getProfile();nav();}
async function logout(){await db.auth.signOut();user=null;profile=null;nav();say('تم تسجيل الخروج','ok');}
async function checkout(){if(!user){closeModal();return authView();}appliedCoupon=null;couponQuote=null;modal('بيانات الطلب',`<div class="field"><label>الاسم</label><input id="cname" value="${esc(profile?.full_name||'')}"></div><div class="field"><label>الجوال</label><input id="cphone" value="${esc(profile?.phone||'')}"></div><div class="field"><label>كود الخصم (اختياري)</label><div class="inline"><input id="couponInput" placeholder="أدخل الكود"><button class="secondary" onclick="applyCoupon()">تطبيق</button></div></div><div id="couponResult" class="summary">السعر قبل الخصم: ${cash(cartSubtotal())}<br>قيمة الخصم: 0.00 ريال<br><b>السعر بعد الخصم: ${cash(cartSubtotal())}</b></div><div class="notice">${esc(settings.bank_details||'بعد إنشاء الطلب ستظهر لك بيانات التحويل البنكي إن كانت مضافة من الإدارة.')}</div><button onclick="createOrders()">إنشاء الطلبات</button>`);}
async function applyCoupon(){const code=$('couponInput').value.trim();if(!code){appliedCoupon=null;couponQuote=null;return updateCouponSummary('أدخل كود الخصم');}const {data,error}=await db.rpc('preview_store_coupon',{p_coupon_code:code,p_subtotal:cartSubtotal()});if(error){appliedCoupon=null;couponQuote=null;updateCouponSummary('تعذر التحقق من الكود: '+error.message);return;}const q=Array.isArray(data)?data[0]:data;if(!q||q.valid===false){appliedCoupon=null;couponQuote=null;updateCouponSummary(q?.message||'كود الخصم غير صالح');return;}appliedCoupon=code.toUpperCase();couponQuote=q;updateCouponSummary('تم تطبيق كود الخصم بنجاح');}
function updateCouponSummary(message=''){const subtotal=cartSubtotal(),discount=Number(couponQuote?.discount_amount||0),total=Number(couponQuote?.total_after_discount??subtotal-discount);$('couponResult').innerHTML=`${message?`<div>${esc(message)}</div>`:''}السعر قبل الخصم: ${cash(subtotal)}<br>قيمة الخصم: ${cash(discount)}<br><b>السعر بعد الخصم: ${cash(total)}</b>`;}
async function createOrders(){const name=$('cname').value.trim(),phone=$('cphone').value.trim();if(!name||!phone)return say('أدخل الاسم ورقم الجوال','bad');if(!cart.length)return say('السلة فارغة','bad');const code=appliedCoupon;for(const x of cart){for(let i=0;i<x.qty;i++){const r=await db.rpc('create_store_order_with_coupon',{p_product_id:x.id,p_customer_name:name,p_customer_phone:phone,p_coupon_code:code});if(r.error)return say(r.error.message,'bad');}}cart=[];$('count').textContent='0';closeModal();say('تم إنشاء طلباتك. ارفع إيصال التحويل من صفحة طلباتي.','ok');await ordersView();}
async function ordersView(){if(!user)return authView();const r=await db.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(r.error)return say(r.error.message,'bad');const orders=r.data||[];const rr=await db.from('reviews').select('order_id').eq('user_id',user.id);const reviewed=rr.error?[]:(rr.data||[]).map(x=>x.order_id);modal('طلباتي',orders.map(o=>`<div class="card"><div class="row"><b>${esc(o.product_name)}</b><span class="pill">${esc(orderStatusLabel(o))}</span></div><p>قبل الخصم: ${cash(o.subtotal??o.total)} ${o.coupon_code?' — الخصم: '+cash(o.discount_amount):''}</p><p><b>المبلغ المطلوب: ${cash(o.total)}</b></p><p>حالة الدفع: ${esc(paymentLabel(o))}</p>${o.payment_status==='paid'?`<div class="notice ok">${o.account_sent_at?'تم إرسال المنتج أو بيانات الحساب إلى بريدك الإلكتروني.':'تم قبول الدفع. سيتم إرسال المنتج إليك يدويًا عبر البريد الإلكتروني.'}</div>${reviewed.includes(o.id)?'<div class="notice">✓ تم تقييم عملية الشراء</div>':`<button onclick="reviewForm('${o.id}','${o.product_id}')">قيّم مشتراك</button>`}`:o.payment_status==='under_review'?'<div class="notice">وصل إيصالك وهو قيد المراجعة.</div>':o.payment_status==='rejected'?`<div class="notice bad">تم رفض الإيصال. ${esc(o.rejection_reason||'يرجى إعادة رفعه.')}</div><button onclick="receiptForm('${o.id}')">إعادة رفع الإيصال</button>`:`<button onclick="receiptForm('${o.id}')">رفع إيصال التحويل</button>`}<p class="muted small">تاريخ الطلب: ${o.created_at?new Date(o.created_at).toLocaleString('ar-SA'):''}</p></div>`).join('')||'<p class="empty">لا توجد طلبات.</p>');}

async function uploadReceipt(id){const f=$('receipt').files[0];if(!f)return say('اختر ملف الإيصال','bad');if(f.size>8*1024*1024)return say('حجم الإيصال يجب ألا يتجاوز 8 ميجابايت','bad');const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${id}/${user.id}/${Date.now()}_${safe}`;const u=await db.storage.from('payment-receipts').upload(path,f);if(u.error)return say('تعذر رفع الإيصال: '+u.error.message,'bad');const r=await db.rpc('submit_payment_receipt',{p_order_id:id,p_receipt_path:path,p_payment_reference:$('ref').value.trim()});if(r.error)return say('تم رفع الملف لكن تعذر تسجيله: '+r.error.message,'bad');closeModal();say('تم إرسال الإيصال للمراجعة','ok');await ordersView();}
async function staffView(){if(!isStaff())return say('ليس لديك صلاحية','bad');const [a,b,c]=await Promise.all([db.from('orders').select('*').order('created_at',{ascending:false}),db.from('products').select('*').order('created_at',{ascending:false}),db.from('coupons').select('*').order('created_at',{ascending:false})]);if(a.error)return say('تعذر تحميل الطلبات: '+a.error.message,'bad');if(b.error)return say('تعذر تحميل المنتجات: '+b.error.message,'bad');if(c.error)return say('تعذر تحميل أكواد الخصم: '+c.error.message,'bad');adminCache.orders=a.data||[];adminCache.products=b.data||[];adminCache.coupons=c.data||[];adminTab='overview';if(isAdmin()){const p=await db.from('profiles').select('id,full_name,role,created_at');adminCache.profiles=p.error?[]:(p.data||[]);}renderAdmin();}

function ordersTable(list){return `<div class="scroll"><table><tr><th>الطلب</th><th>العميل</th><th>المبلغ</th><th>الحالة</th><th>الإجراءات</th></tr>${list.map(o=>`<tr><td><b>${esc(o.product_name)}</b><div class="small muted">${esc(o.id)}</div></td><td>${esc(o.customer_name)}<div class="small">${esc(o.customer_email||'البريد غير مسجل')}</div><div class="small">${esc(o.customer_phone||'الجوال غير مسجل')}</div></td><td>${cash(o.total)}<div class="small muted">قبل الخصم ${cash(o.subtotal??o.total)}</div></td><td>${esc(paymentLabel(o))}<div class="small muted">${o.account_sent_at?'تم التسليم':o.payment_status==='paid'?'بانتظار التسليم':''}</div></td><td><div class="actions"><button class="secondary" onclick="orderDetails('${o.id}')">تفاصيل</button>${o.receipt_path?`<button class="secondary" onclick="showReceipt('${o.id}')">الإيصال</button>`:''}${o.payment_status==='under_review'?`<button class="success" onclick="approve('${o.id}')">قبول</button><button class="danger" onclick="reject('${o.id}')">رفض</button>`:''}${o.payment_status==='paid'&&!o.account_sent_at?`<button onclick="markAccountSent('${o.id}')">تم الإرسال بالبريد</button>`:''}${o.account_sent_at?'<span class="pill">تم التسليم</span>':''}</div></td></tr>`).join('')||'<tr><td colspan="5">لا توجد طلبات.</td></tr>'}</table></div>`;}
function filterAdminOrders(){const q=($('orderSearch').value||'').toLowerCase();$('ordersTable').innerHTML=ordersTable(adminCache.orders.filter(o=>[o.id,o.product_name,o.customer_name,o.customer_email,o.customer_phone].some(v=>String(v||'').toLowerCase().includes(q))));}
async function saveSettings(){
  if(!isAdmin()) return say('هذه الخاصية للمدير فقط','bad');

  const value = $('bankDetails').value.trim();

  const updated = await db
    .from('store_settings')
    .update({value})
    .eq('key','bank_details')
    .select();

  if(updated.error)
    return say('تعذر حفظ الإعدادات: '+updated.error.message,'bad');

  if(!updated.data || updated.data.length === 0){
    const inserted = await db
      .from('store_settings')
      .insert({key:'bank_details',value});

    if(inserted.error)
      return say('تعذر إضافة الإعدادات: '+inserted.error.message,'bad');
  }

  settings.bank_details = value;
  say('تم حفظ بيانات التحويل البنكي','ok');
}

async function saveCoupon(id){const code=$('cpCode').value.trim().toUpperCase().replace(/\s+/g,''),type=$('cpType').value,value=Number($('cpValue').value),limit=$('cpLimit').value.trim(),expiry=$('cpExpiry').value;if(!/^[A-Z0-9_-]{3,40}$/.test(code))return say('الكود يجب أن يكون من 3 إلى 40 حرفًا أو رقمًا','bad');if(!Number.isFinite(value)||value<=0||(type==='percent'&&value>100))return say('قيمة الخصم غير صحيحة','bad');if(limit&&(!Number.isInteger(Number(limit))||Number(limit)<1))return say('حد الاستخدام غير صحيح','bad');const payload={code,discount_type:type,discount_value:value,usage_limit:limit?Number(limit):null,expires_at:expiry?new Date(expiry).toISOString():null,is_active:$('cpActive').checked};const r=id?await db.from('coupons').update(payload).eq('id',id):await db.from('coupons').insert(payload);if(r.error)return say(r.error.message,'bad');say('تم حفظ كود الخصم','ok');await staffView();}

function productForm(p={}){modal(p.id?'تعديل منتج':'إضافة منتج',`<div class="field"><label>اسم المنتج</label><input id="pn" value="${esc(p.name||'')}"></div><div class="field"><label>الوصف</label><textarea id="pd">${esc(p.description||'')}</textarea></div><div class="field"><label>السعر</label><input id="pp" type="number" min="0" step="0.01" value="${p.price??''}"></div><div class="field"><label>التصنيف</label><input id="pc" value="${esc(p.category||'')}"></div><div class="field"><label>المخزون</label><input id="ps" type="number" min="0" value="${p.stock??0}"></div><label><input id="pu" type="checkbox" ${p.is_unlimited?'checked':''}> مخزون غير محدود</label><div class="field"><label>صورة المنتج</label><input id="pi" type="file" accept="image/*"></div><label><input id="pa" type="checkbox" ${p.is_active===false?'':'checked'}> المنتج ظاهر في المتجر</label><p class="small muted">التسليم للعميل يتم يدويًا عبر البريد بعد اعتماد الدفع.</p><p><button onclick="saveProduct('${p.id||''}')">حفظ المنتج</button></p>`);}
async function edit(id){let p=adminCache.products.find(x=>x.id===id)||products.find(x=>x.id===id);if(!p){const r=await db.from('products').select('*').eq('id',id).single();if(r.error)return say(r.error.message,'bad');p=r.data;}productForm(p||{});}
async function saveProduct(id){const v={name:$('pn').value.trim(),description:$('pd').value,price:Number($('pp').value),category:$('pc').value.trim(),stock:Number($('ps').value||0),is_unlimited:$('pu').checked,is_active:$('pa').checked,updated_at:new Date().toISOString()};if(!v.name)return say('اكتب اسم المنتج','bad');if(!Number.isFinite(v.price)||v.price<0)return say('تحقق من السعر','bad');if(!Number.isFinite(v.stock)||v.stock<0)return say('تحقق من المخزون','bad');const r=id?await db.from('products').update(v).eq('id',id).select().single():await db.from('products').insert(v).select().single();if(r.error)return say(r.error.message,'bad');const pid=r.data.id,img=$('pi').files[0];if(img){if(img.size>5*1024*1024)return say('حجم الصورة أكبر من 5 ميجابايت','bad');const path=pid+'/'+Date.now()+'_'+img.name.replace(/[^a-zA-Z0-9._-]/g,'_');const u=await db.storage.from('product-images').upload(path,img);if(u.error)return say('تم حفظ المنتج لكن تعذر رفع الصورة: '+u.error.message,'bad');const url=db.storage.from('product-images').getPublicUrl(path).data.publicUrl;const up=await db.from('products').update({image_url:url}).eq('id',pid);if(up.error)return say(up.error.message,'bad');}closeModal();say('تم حفظ المنتج','ok');await getProducts();await staffView();}
init().catch(e=>say(e.message||'حدث خطأ أثناء تشغيل المتجر','bad'));
</script>
</body>
</html>
